const icons={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',scan:'<path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M7 12h10M12 7v10"/>',records:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6m-6 4h6m-6 4h4"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 1 1 4 3v2m-1 3h.01"/>',leaf:'<path d="M19 3C9 1 2 6 4 14c2 8 16 6 15-11Z"/><path d="M5 21 15 9m-6 7-1-5m4 2 5 1"/>'};const icon=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[k]||icons.leaf}</svg>`;
let state={view:'home',profile:null,active:null,pending:false,shared:false,kind:'resume',revoked:false,empty:false};let interval;const getPath=()=>location.hash.slice(1)||'/';function go(p){location.hash=p}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function notify(t){let n=document.querySelector('#toast');n.textContent=t;n.style.display='block';setTimeout(()=>n.style.display='none',2800)}const name=()=>state.profile?.name||'Ana';const isMinor=()=>state.profile?.minor||false;const tree=`<svg viewBox="0 0 240 230" fill="none" aria-hidden="true"><circle cx="122" cy="110" r="87" stroke="#7c9b68" stroke-opacity=".35"/><circle cx="122" cy="110" r="103" stroke="#7c9b68" stroke-opacity=".16"/><path d="M120 189V87m0 45-29-25m29 42 34-31" stroke="#d2ddad" stroke-width="4"/><path d="M121 111C76 119 52 85 70 49c39-3 61 24 51 62Z" fill="#7c9b68"/><path d="M123 135c-8-45 20-77 57-68 10 38-13 69-57 68Z" fill="#a8bd89"/><path d="M121 95c-19-28-13-60 14-75 28 22 24 56-14 75Z" fill="#d1dcac"/><path d="M81 192h81" stroke="#91a77a" stroke-width="2"/><circle cx="180" cy="38" r="4" fill="#d1dcac"/><circle cx="62" cy="145" r="3" fill="#a8bd89"/></svg>`;
function navItem(p,label,k){let sel=getPath()===p||(p==='/me'&&getPath().startsWith('/me'));return `<a href="#${p}" class="${sel?'sel':''}">${icon(k)}<span>${label}</span></a>`}function layout(body){return `<div class="shell"><aside><a class="brand" href="#/">${icon('leaf')}SycaMore</a><div class="live">LIVE · VOLUNTEERS</div><nav>${navItem('/','Overview','home')}${navItem('/checkin','Check in / out','scan')}${navItem('/me','My hours','records')}${navItem('/help','How it works','help')}</nav><div class="sidebottom"><div class="support">Small acts.<br>Lasting roots.</div><a href="#/join" class="profile"><span class="avatar">${esc(name().slice(0,1))}</span><span>${esc(name())}${state.profile?'':' Rivera'}<br><small class="muted">Volunteer account ↗</small></span></a></div></aside><div class="workspace"><header><span class="crumb">Your volunteer space <span class="muted"> / ${getPath().startsWith('/me')?'My hours':getPath().startsWith('/badges')?'My badges':getPath()==='/journey'?'My journey':getPath()==='/checkin'?'Check in': 'Overview'}</span></span><a class="brand" href="#/">${icon('leaf')}SycaMore</a><div class="topright"><span class="pill">● VOLUNTEER</span><a href="#/help" class="muted">Need a hand? ↗</a></div></header><div class="sample">STRUCTURE PREVIEW · Sample records and interactions. No real hours are recorded.</div><main>${body}<footer><span>SycaMore Live<br>Rooted in service. Backed by your organization.</span><a href="#/help">How your hours are verified ↗</a></footer></main></div><nav class="mobile-nav">${navItem('/','Home','home')}${navItem('/checkin','Check in','scan')}${navItem('/me','My hours','records')}${navItem('/help','Help','help')}</nav></div>`}
function card(second=false){return `<a href="#/me/records/${second?'r2':'r1'}" class="card record" style="display:flex"><div class="datebox">OCT<b>${second?'10':'17'}</b></div><div class="info"><h3>${second?'Community food drive':'Coyote Creek restoration'}</h3><p>Riverside Restoration Crew</p><div class="bottom"><span class="pill">✓ ATTESTED</span><span>${second?'General volunteer':'Team lead'}</span></div></div><div class="hours">${second?'2':'3'}<small>HOURS ↗</small></div></a>`}function pending(){return `<div class="card"><span class="pill pending">◷ PENDING</span><h3 style="margin-top:14px">Riverbank planting day</h3><p class="muted" style="font-size:13px;margin-bottom:0">Waiting for Riverside Restoration Crew to confirm</p></div>`}function activeBanner(){return `<div class="notice">● You're checked in at Riverbank planting day. <a class="textlink" href="#/checkin">View session →</a></div>`}
function home(){return `<div class="intro"><div><span class="eyebrow">YOUR TIME MAKES A DIFFERENCE</span><h1>Good to see you, ${esc(name().split(' ')[0])}.</h1><p class="muted">Every hour has a story. Here’s yours.</p></div><a href="#/checkin" class="btn">${icon('scan').replace('<svg ','<svg width="18" height="18" ')} Check in to an event</a></div>${state.active?activeBanner():''}<section class="hero"><div class="hero-text"><span class="eyebrow">SHOW UP. MAKE A DIFFERENCE.</span><h2>You do the good.<br>We keep the record.</h2><p>At an event? Enter your coordinator’s code to get started. Your hours follow from there.</p><a href="#/checkin" class="btn light">Check in to an event <span>↗</span></a></div><div class="hero-art">${tree}</div></section><section class="stats"><div class="stat"><b>${state.empty?'0':'5'}</b><span>Attested hours</span></div><div class="stat"><b>${state.empty?'0':'2'}</b><span>Completed events</span></div><div class="stat"><b>${state.empty?'0':'1'}</b><span>Issuing organization</span></div></section><div class="columns"><section><div class="sectionhead"><h2>Your recent service</h2><a class="textlink" href="#/me">View all hours →</a></div>${state.empty?empty():card()+card(true)}${state.pending?pending():''}</section><section><h2>More than a number.</h2><div class="card tip"><div class="mini-icon">✧</div><h3>Let your service speak.</h3><p>Turn an attested record into a resume line or scholarship sentence, with the facts kept intact.</p><a href="#/me/records/r1" class="textlink">Use a record →</a></div><div class="card"><span class="eyebrow">YOUR RECORD, YOUR CHOICE</span><p style="font-size:13px;margin:12px 0 0">You choose when to share. Anyone with your link can see the issuing organization and verify your record.</p></div></section></div>`}
function empty(){return `<div class="card empty"><div class="mini-icon">♧</div><h2>Your story starts here.</h2><p class="muted">Check in at your next event. Once your organization confirms your service, your record will appear here.</p><a href="#/checkin" class="btn">Check in to an event</a></div>`}
function me(){return `<div class="intro"><div><span class="eyebrow">YOUR SERVICE WALLET</span><h1>My hours</h1><p class="muted">Confirmed by your organization. Always yours to keep.</p></div><a href="#/checkin" class="btn">Check in ↗</a></div>${state.active?activeBanner():''}<div class="columns"><section><h2>Attested records <span class="muted">${state.empty?'0':'2'}</span></h2>${state.empty?empty():card()+card(true)}<h2 style="margin-top:30px">Pending confirmation</h2>${state.pending?pending():'<div class="card"><p class="muted" style="margin:0;font-size:13px">You’re all caught up. No service waiting for confirmation.</p></div>'}</section><section><div class="card tip"><span class="eyebrow">WHAT COUNTS AS OFFICIAL?</span><h3 style="margin-top:13px">Confirmed. Then counted.</h3><p>Pending sessions become official records after the coordinator reviews and attests them. Until then, no hour total is shown.</p></div><div class="card"><h3>Signed badges</h3><p class="muted" style="font-size:13px">No signed badges yet. Badges appear here only after an organization signs them.</p></div></section></div><div class="demo-tools">Preview states: <button onclick="state.empty=!state.empty;render()">${state.empty?'Show sample records':'Show empty state'}</button><button onclick="state.pending=!state.pending;render()">Toggle pending</button></div>`}
function join(){return `<div class="narrow"><div class="center"><span class="eyebrow">WELCOME TO SYCAMORE LIVE</span><h1>A little time.<br>A lasting difference.</h1><p class="muted">Create your volunteer profile in one step.</p></div><form class="card formcard" id="joinform"><label class="field">Your name<input name="name" autocomplete="name" placeholder="Ana Rivera" required maxlength="100"></label><label class="field">Email address<input type="email" name="email" autocomplete="email" placeholder="ana@example.test" required></label><label class="field">Date of birth<input type="date" name="dob" required max="${new Date().toISOString().slice(0,10)}"></label><div id="joinerror" role="alert"></div><button class="btn wide">Continue →</button><p class="muted" style="font-size:11px;margin:15px 0 0">For volunteers aged 13 and older. Volunteers under 18 can see their records; sharing requires a guardian’s OK.</p></form><p class="center muted" style="font-size:12px">Preview only. Form details are held in memory and cleared on refresh.<br>Live sign-in will be connected to the shared app.</p></div>`}
function checkin(){return `<div class="narrow"><span class="eyebrow">RIGHT HERE. RIGHT NOW.</span><h1>${state.active?'You’re making a difference.':'Ready to lend a hand?'}</h1><p class="muted">${state.active?'Your session is in progress. Check out when you finish.':'Scan the event QR code, or enter the code your coordinator gives you.'}</p>${state.active?`<div class="card center"><span class="pill">● ACTIVE SESSION · PREVIEW</span><h2 style="margin-top:25px">Riverbank planting day</h2><p class="muted">Riverside Restoration Crew<br>Coyote Creek · San José, CA</p><div class="timer" id="timer">00:00:00</div><p class="muted" style="font-size:12px">Time in this session · not yet attested</p><button class="btn wide" onclick="checkout()">Check out</button></div>`:`<form id="checkform" class="card formcard"><label class="field">6-character event code<input name="code" class="code" placeholder="PLANT2" maxlength="6" minlength="6" pattern="[A-HJ-NP-Z2-9]{6}" value="${esc(new URLSearchParams(location.search).get('code')||'')}" required autocomplete="off" autocapitalize="characters" oninput="this.value=this.value.toUpperCase()"></label><p class="muted" style="font-size:12px">Ask your coordinator if you don’t have a code.</p><div id="checkerror" role="alert"></div><button class="btn wide">Check in →</button></form><div class="notice">Try sample code <b>PLANT2</b>. This preview simulates the session on this page.</div>`}<div class="card tip"><h3>Let your time do the talking.</h3><p style="margin:0">Check in when you arrive. Check out when you leave. Your coordinator confirms your record after the event.</p></div>${!state.profile?'<p class="center"><a class="textlink" href="#/join?next=/checkin">New here? Create your profile →</a></p>':''}</div>`}
function checkout(){state.active=null;state.pending=true;go('/me');notify('Checked out in preview. Waiting for your organization to confirm.')}function wording(second=false){const h=second?2:3;return `<p><strong>Riverside Restoration Crew</strong> states that <strong>${esc(state.profile?.name||'Ana Rivera')}</strong> served as <strong>${second?'general':'team_lead'}</strong> at <strong>${second?'Community food drive':'Coyote Creek restoration'}</strong> on <strong>${second?'2026-10-10':'2026-10-17'}</strong>, for <strong>${h} attested hours</strong>: ${second?'2':'2.75'} captured by check-in and check-out${second?'':', adjusted to 3 by Sam Rivera: "Included 15 minutes of equipment cleanup after check-out"'}. The organization confirmed this when it closed the event.</p><p class="muted" style="font-size:12px">SycaMore Live recorded these hours and did not observe the work itself. Questions about this service go to Riverside Restoration Crew at (408) 555-0142.</p>`}
function record(publicPage=false){let second=getPath().endsWith('r2');return `<div class="${publicPage?'verification':''}">${!publicPage?'<a class="textlink" href="#/me">← Back to my hours</a>':''}<div class="intro" style="margin-top:20px"><div><span class="eyebrow">${publicPage?'PUBLIC VERIFICATION':'YOUR VERIFIED SERVICE'}</span><h1>A record worth sharing.</h1><p class="muted">Issued by the organization that knows your work.</p></div></div>${publicPage?`<div class="verified ${state.revoked?'revoked':''}"><strong>${state.revoked?'REVOKED':'VERIFIED · issued by Riverside Restoration Crew'}</strong><br><small>${state.revoked?'This record is no longer valid. Contact the issuer for details.':'Sample record · demonstration only'}</small></div>`:''}<div class="${publicPage?'':'detailgrid'}"><section class="card certificate"><span class="eyebrow">SYCAMORE LIVE · SERVICE RECORD</span><h2>${second?'Community food drive':'Coyote Creek restoration'}</h2><span class="pill">${state.revoked?'REVOKED':'✓ ORGANIZATION-ATTESTED'}</span><div class="split"><div><b>${second?'2':'3'} hours</b><span class="muted">Total attested</span></div><div><b>${second?'Volunteer':'Team lead'}</b><span class="muted">Role confirmed by coordinator</span></div></div>${wording(second)}<div class="split" style="font-size:12px"><div><strong>Captured time</strong><br>${second?'2':'2.75'} hours · check-in/out</div><div><strong>Coordinator adjustment</strong><br>${second?'None':'+0.25 hours · Sam Rivera'}</div></div><small class="muted">Attested on ${second?'October 10':'October 17'}, 2026 · All times Pacific<br>Sample data for website structure preview.</small></section>${publicPage?`<section class="card"><h3>Questions about this service:</h3><p class="muted">Riverside Restoration Crew<br><a href="tel:+14085550142">(408) 555-0142</a><br>hello@riverside.example.test</p><small>Demo organization and contact details.</small></section><div class="demo-tools">Verification states: <button onclick="state.revoked=!state.revoked;render()">${state.revoked?'Show verified':'Show revoked'}</button><a class="textlink" href="#/v/UNKNOWN">Unknown code →</a></div>`:`<section><div class="card"><h3>Your record. Your link.</h3><p class="muted" style="font-size:13px">Share proof of your service with a school or scholarship committee.</p>${isMinor()?'<div class="notice">Sharing needs a guardian’s OK. Coming after the hackathon.</div>':`<button class="btn wide" onclick="state.shared=true;render()">${state.shared?'Share link created ✓':'Create sample share link ↗'}</button>${state.shared?'<img src="share-qr.png" width="160" height="160" alt="QR code for the sample verification record" style="display:block;margin:16px auto"><p class="shareurl">'+esc(location.href.split('#')[0])+'#/v/SYC-DEMO-TEST</p><button class="btn secondary wide" onclick="copy(location.href.split(\'#\')[0]+\'#/v/SYC-DEMO-TEST\')">Copy link</button><p><a class="textlink" href="#/v/SYC-DEMO-TEST">Open public-page preview ↗</a></p><small class="muted">Sample verification link. Scan to open this demonstration record.</small>':''}`}</div><div class="card tip"><span class="eyebrow">USE THIS RECORD</span><h3 style="margin-top:10px">Your service, put into words.</h3><p>Start with a line grounded in this record.</p><div class="tabs"><button class="${state.kind==='resume'?'sel':''}" onclick="state.kind='resume';render()">Resume</button><button class="${state.kind==='scholarship'?'sel':''}" onclick="state.kind='scholarship';render()">Scholarship</button></div><button class="btn secondary wide" onclick="blurb(${second})">Preview a sentence ✧</button><div id="blurb"></div><small class="muted">Template preview. OpenAI drafting and server-side number checks will be connected in the shared app.</small></div></section>`}</div></div>`}
function blurb(second){let sentence=state.kind==='resume'?`Served as ${second?'a general volunteer':'a team lead'} for ${second?'2':'3'} attested hours at Riverside Restoration Crew’s ${second?'Community food drive':'Coyote Creek restoration'}.`:`I contributed ${second?'2':'3'} attested hours as ${second?'a general volunteer':'a team lead'} at Riverside Restoration Crew’s ${second?'Community food drive':'Coyote Creek restoration'}.`;document.querySelector('#blurb').innerHTML=`<p class="blurb">${sentence}</p><button class="btn secondary" id="copyblurb">Copy sentence</button><p class="muted" style="font-size:11px;margin-top:15px">Hours from Riverside Restoration Crew’s attested record. Edit the wording before you use it.</p>`;document.querySelector('#copyblurb').onclick=()=>copy(sentence)}async function copy(t){try{await navigator.clipboard.writeText(t);notify('Copied to clipboard')}catch{notify('Copy unavailable in this browser. Select and copy the text.')}}
function help(){return `<span class="eyebrow">SIMPLE ON PURPOSE</span><h1>Show up. We’ll keep track.</h1><p class="muted">From your first check-in to a record you can share.</p><div class="steps"><div class="card"><span>01</span><h3>Check in at the event</h3><p>Scan the coordinator’s QR code or enter the event code. No hour entry needed.</p></div><div class="card"><span>02</span><h3>Check out when done</h3><p>Your timestamps capture your time. Your coordinator reviews and attests your service.</p></div><div class="card"><span>03</span><h3>Keep the proof</h3><p>Your attested record shows the issuer, hours, role, and any coordinator adjustment.</p></div></div><div class="columns"><div class="card"><h2>Who confirms my hours?</h2><p>Your organization does. SycaMore records the timestamps and displays the organization’s attestation; it does not observe the work itself.</p><h2 style="margin-top:25px">Can I change the number?</h2><p>No. If something looks wrong, contact your coordinator. Their adjustments must include a reason shown on the record.</p></div><div class="card tip"><h2>What if I’m under 18?</h2><p>You can check in and see your hours if you’re 13 or older. Sharing needs a guardian’s OK. Guardian consent is coming after the hackathon.</p><a href="#/join" class="textlink">Create your profile →</a></div></div>`}
function render(){clearInterval(interval);let p=getPath();let body=p.startsWith('/join')?join():p==='/checkin'?checkin():p==='/me'?me():p.startsWith('/me/records/')?record():p==='/help'?help():p.startsWith('/v/')?(p==='/v/SYC-DEMO-TEST'?record(true):'<div class="narrow empty"><h1>No record with this code</h1><p class="muted">Check the link or ask the issuing organization.</p><a href="#/" class="btn secondary">Return home</a></div>'):home();document.querySelector('#app').innerHTML=layout(body);if(document.querySelector('#joinform'))document.querySelector('#joinform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),dob=new Date(f.get('dob')+'T12:00:00'),today=new Date(),age=today.getFullYear()-dob.getFullYear()-(today.getMonth()<dob.getMonth()||(today.getMonth()===dob.getMonth()&&today.getDate()<dob.getDate())?1:0);if(age<13){document.querySelector('#joinerror').innerHTML='<div class="notice error">You must be at least 13 to join SycaMore. Your information has not been saved.</div>';return}state.profile={name:f.get('name'),minor:age<18};go(p.includes('next=')?p.split('next=')[1]:'/');notify('Profile preview ready')};if(document.querySelector('#checkform'))document.querySelector('#checkform').onsubmit=e=>{e.preventDefault();let c=new FormData(e.target).get('code');if(c!=='PLANT2'){document.querySelector('#checkerror').innerHTML='<div class="notice error">We couldn’t find that event. Check the code with your coordinator.</div>';return}state.active=Date.now();render()};if(state.active&&p==='/checkin'){let tick=()=>{let s=Math.floor((Date.now()-state.active)/1000);document.querySelector('#timer').textContent=[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':')};tick();interval=setInterval(tick,1000)}}window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();

function emblem(b){return `<div class="badge-emblem ${b.color}">${icon(b.mark)}</div>`}
function badgeTile(b){return `<a class="card badgecard" href="#/badges/${b.id}">${emblem(b)}<span class="pill ${b.status==='earned'?'':'pending'}">${b.status==='earned'?'✓ SIGNED':b.status==='progress'?'IN PROGRESS':'NOT YET EARNED'}</span><h3>${b.name}</h3><p>${b.status==='earned'?'Issued by Riverside Restoration Crew':b.status==='progress'?'Keep showing up. Your next milestone is in reach.':'Your next chapter starts with a confirmed role.'}</p>${b.status==='earned'?`<div class="badge-meta"><span>${b.events} events · ${b.hours} attested hours</span><span>Signed by ${b.signer} · ${b.date}</span></div>`:`<div class="progress-track"><span style="width:${b.status==='progress'?66.67:0}%"></span></div><small class="muted">${b.events} / ${b.targetEvents} events · ${b.hours} / ${b.targetHours} hours</small>`}<p class="textlink" style="margin:18px 0 0">${b.status==='earned'?'View evidence & share':'See requirements'} →</p></a>`}
function badgeMini(){return `<section class="card"><div class="sectionhead"><h3>My badges</h3><a class="textlink" href="#/badges">See all →</a></div><div class="badges-mini">${badges.slice(0,3).map(b=>`<a href="#/badges/${b.id}" class="badge-summary">${emblem(b)}<div><h3>${b.name}</h3><p>${b.status==='earned'?'✓ Signed by your organization':'2 of 3 leadership events'}</p></div></a>`).join('')}</div></section>`}
function badgePage(){let b=badges[2];return `<div class="intro"><div><span class="eyebrow">YOUR WORK, RECOGNIZED</span><h1>My badges</h1><p class="muted">The story behind your service, signed by the people who saw it.</p></div><span class="pill">2 SIGNED BADGES · SAMPLE DATA</span></div><a href="#/badges/leadership" class="badgefeature">${emblem(b)}<div><span class="eyebrow">UP NEXT</span><h2>Team Leadership</h2><p>1 more team-lead event and 3 more attested hours.</p><div class="progress-track"><span style="width:66.67%"></span></div><small class="muted">2 / 3 events · 6 / 9 hours</small></div><span style="margin-left:auto">↗</span></a><div class="badgegrid">${badges.map(badgeTile).join('')}</div><div class="notice">Sample badge portfolio for the UI preview. A badge is earned only when its issuing organization signs it; progress alone is not a credential.</div><a href="#/journey" class="textlink">See the service journey behind your badges →</a>`}
function badgeDetail(id){let b=badges.find(b=>b.id===id);if(!b)return '<h1>Badge not found</h1><a href="#/badges">Back to badges</a>';let earned=b.status==='earned';return `<a href="#/badges" class="textlink">← All badges</a><div class="intro" style="margin-top:20px"><div><span class="eyebrow">${earned?'SIGNED RECOGNITION':'YOUR NEXT MILESTONE'}</span><h1>${b.name}</h1></div></div><div class="detailgrid"><section class="card certificate">${emblem(b)}<span class="pill ${earned?'':'pending'}">${earned?'✓ SIGNED · SAMPLE AWARD':'NOT YET ISSUED'}</span><h2>${earned?esc(state.profile?.name||'Ana Rivera'):'Keep growing through service.'}</h2><p>${earned?esc(b.evidence):'Confirmed service builds progress. Your organization reviews the evidence and signs the award.'}</p>${earned?`<ul class="evidence"><li>${b.events} documented events</li><li>${b.hours} attested service hours</li><li>Coordinator evidence note on file</li><li>Signed by ${b.signer} on ${b.date}</li></ul><div class="badge-meta"><strong>Issuer: Riverside Restoration Crew</strong><span>Credential ID: DEMO-${b.id.toUpperCase()}</span><span>This is an organization-issued service recognition, not a SycaMore assessment of professional skills.</span></div>`:`<h3>Requirements</h3><ul class="evidence"><li>${b.targetEvents} ${b.id==='leadership'?'team-lead':'coordination'} events</li><li>${b.targetHours} attested hours in that role</li><li>Organization review and sign-off</li></ul><div class="progress-track"><span style="width:${b.status==='progress'?66.67:0}%"></span></div><p>${b.events} / ${b.targetEvents} events · ${b.hours} / ${b.targetHours} hours</p><small class="muted">A badge is issued only after your organization reviews and signs the evidence. Some awards include a 48-hour review hold.</small>`}</section><section>${earned?`<div class="card"><h3>Let your service travel.</h3><p class="muted" style="font-size:13px">Create a post or keep a copy of this recognition.</p>${isMinor()?'<div class="notice">Sharing needs a guardian’s OK. Coming after the hackathon.</div>':`<button class="btn linkedin wide" onclick="openLinkedIn('${b.id}')">in &nbsp; Share a LinkedIn post ↗</button><button class="btn secondary wide" style="margin-top:10px" onclick="openLinkedIn('${b.id}',true)">Add to LinkedIn profile</button>`}<button class="btn secondary wide" style="margin-top:10px" onclick="window.print()">Print / save certificate</button><p class="muted" style="font-size:11px;margin-top:15px">Demo credentials cannot be published as real awards. The preview lets you review and copy the wording.</p></div>`:`<div class="card tip"><h3>One event at a time.</h3><p>Ask your coordinator about opportunities to take on this role. Only attested work contributes to your progress.</p><a href="#/checkin" class="btn">Check in at an event →</a></div>`}<div class="card"><h3>See the evidence</h3><p class="muted" style="font-size:13px">Follow the event and role history behind your recognition.</p><a class="textlink" href="#/journey">View my journey →</a></div></section></div>`}
function journey(){return `<span class="eyebrow">YOUR SERVICE, OVER TIME</span><h1>My journey</h1><p class="muted">Every event. Every role. A little more responsibility.</p><div class="notice">Illustrative journey for the badge preview. These sample events are separate from the two example hour records.</div><div class="timeline">${[{date:'OCT 17, 2026',role:'Team lead',event:'Creek restoration & equipment logistics',note:'Signed recognition: Resource Logistics Organizer and Urban Canopy Practitioner.'},{date:'OCT 10, 2026',role:'Team lead',event:'Neighborhood planting day',note:'Coordinated a volunteer group and organized equipment returns.'},{date:'SEP 26, 2026',role:'General volunteer',event:'Tree-care and mulching day',note:'Documented planting and tree-care work confirmed by the coordinator.'},{date:'SEP 12, 2026',role:'General volunteer',event:'First community restoration event',note:'Your first step. Showed up, helped out, and started a service record.'}].map(e=>`<div class="card"><span class="eyebrow">${e.date}</span><h3 style="margin:12px 0">${e.event}</h3><span class="journey-role">${e.role}</span><p class="muted" style="font-size:13px;margin:15px 0 0">${e.note}</p><small class="muted">Riverside Restoration Crew · sample history</small></div>`).join('')}</div>`}
function openLinkedIn(id,profile=false){if(isMinor()){notify('Sharing needs a guardian’s OK.');return}const b=badges.find(b=>b.id===id);const text=b?`[Demo preview] I earned the ${b.name} recognition from Riverside Restoration Crew, backed by ${b.events} documented events and ${b.hours} attested service hours. ${b.evidence}`:`[Demo preview] I contributed 3 attested hours as a team lead at Riverside Restoration Crew’s Coyote Creek restoration event on October 17, 2026.`;document.querySelector('#share-dialog')?.remove();let d=document.createElement('div');d.id='share-dialog';d.className='overlay';d.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="share-title"><button class="close" aria-label="Close share preview" onclick="closeShare()">×</button><span class="eyebrow">YOUR STORY, YOUR WORDS</span><h2 id="share-title" style="margin-top:12px">${profile?'Add to your LinkedIn profile':'Preview your LinkedIn post'}</h2>${profile?`<p class="muted" style="font-size:13px">For a live signed badge, use LinkedIn’s Licenses & certifications section with the issuer, issue date, credential ID, and public verification URL.</p><ul class="evidence"><li>Name: ${b.name}</li><li>Issuing organization: Riverside Restoration Crew</li><li>Issued: October 2026</li><li>Credential ID: DEMO-${b.id.toUpperCase()}</li></ul>`:''}<label class="field" for="post-text">${profile?'Suggested description':'Post text'}</label><textarea id="post-text">${esc(text)}</textarea><div class="notice">Sample award only. A live credential will include its public verification link. Nothing is posted automatically.</div><button class="btn linkedin wide" id="copy-post">Copy ${profile?'description':'post text'}</button><a class="btn secondary wide" style="margin-top:10px" href="https://www.linkedin.com/feed/" target="_blank" rel="noopener noreferrer">Open LinkedIn to write a post ↗</a><p class="muted" style="font-size:11px;margin:12px 0">Copy your text, then paste it into a new LinkedIn post. You review and publish it there. For a real badge, include its public verification link.</p><button class="btn secondary wide" style="margin-top:10px" onclick="closeShare()">Done</button></section>`;document.body.append(d);d.querySelector('#copy-post').onclick=()=>copy(d.querySelector('textarea').value);d.querySelector('.close').focus()}
function closeShare(){document.querySelector('#share-dialog')?.remove()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeShare();if(e.key==='Tab'&&document.querySelector('#share-dialog')){const f=[...document.querySelectorAll('#share-dialog button,#share-dialog textarea,#share-dialog a')];if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus()}}});
let phoneMode=false;function setDevice(phone){phoneMode=phone;document.body.classList.toggle('phone-view',phone);render();window.scrollTo(0,0)}
const baseLayout=layout;layout=function(body){let html=baseLayout(body);html=html.replace(navItem('/help','How it works','help'),navItem('/badges','My badges','leaf')+navItem('/journey','My journey','records')+navItem('/help','How it works','help'));html=html.replace('<nav class="mobile-nav">'+navItem('/','Home','home')+navItem('/checkin','Check in','scan')+navItem('/me','My hours','records')+navItem('/help','Help','help'),'<nav class="mobile-nav">'+navItem('/','Home','home')+navItem('/badges','Badges','leaf')+navItem('/checkin','Check in','scan')+navItem('/journey','Journey','records')+navItem('/me','Hours','records'));return html+`<div class="device-controls" aria-label="Preview layout"><button class="${phoneMode?'':'sel'}" onclick="setDevice(false)">Desktop</button><button class="${phoneMode?'sel':''}" onclick="setDevice(true)">Phone</button></div>`};
const baseHome=home;home=function(){return baseHome().replace('<section><h2>More than a number.</h2>','<section>'+badgeMini()+'<h2 style="margin-top:25px">More than a number.</h2>').replace('<span>Issuing organization</span>','<span>Issuing organization</span>')+`<div class="sectionhead" style="margin-top:25px"><h2>Your next chapter</h2><a class="textlink" href="#/journey">View journey →</a></div><a href="#/badges/leadership" class="badgefeature">${emblem(badges[2])}<div><span class="eyebrow">UP NEXT · SAMPLE PROGRESS</span><h2>Team Leadership</h2><p>1 more team-lead event · 3 more attested hours</p></div><span style="margin-left:auto">→</span></a>`};
const baseMe=me;me=function(){return baseMe().replace('<div class="card"><h3>Signed badges</h3><p class="muted" style="font-size:13px">No signed badges yet. Badges appear here only after an organization signs them.</p></div>',badgeMini())};
const baseRecord=record;record=function(publicPage=false){let html=baseRecord(publicPage);if(!publicPage&&!isMinor())html=html.replace('<h3>Your record. Your link.</h3>','<h3>Your record. Your link.</h3><button class="btn linkedin wide" style="margin:12px 0" onclick="openLinkedIn(null)">in &nbsp; Preview LinkedIn post</button>');return html};
const baseRender=render;render=function(){let p=getPath();if(p==='/badges'||p.startsWith('/badges/')||p==='/journey'){clearInterval(interval);document.querySelector('#app').innerHTML=layout(p==='/badges'?badgePage():p==='/journey'?journey():badgeDetail(p.split('/')[2]));return}baseRender()};render();

// Phase 1 preserves the shared contract; all interactions here are demo fixtures.
let goal=40, badgeFilter='all';const savedEvents=new Set();
const landscape=(food=false)=>`<svg viewBox="0 0 500 140" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${food?'<rect width="500" height="140" fill="#e9e4cf"/><path d="M0 125 500 90v50H0" fill="#d4c9a5"/><rect x="230" y="48" width="130" height="75" rx="4" fill="#a6b28b"/><path d="M230 48h130l-25-25h-80Z" fill="#c4cba9"/><path d="M294 48v75" stroke="#7c8d69" stroke-width="3"/><circle cx="165" cy="80" r="29" fill="#b7791f" opacity=".7"/><path d="m165 53 10-15" stroke="#2f6b4f" stroke-width="5"/><path d="M381 121V56m0 27-22-18m22 35 23-18" stroke="#2f6b4f" stroke-width="4"/>':'<rect width="500" height="140" fill="#dce7ce"/><circle cx="380" cy="31" r="24" fill="#faf8f2"/><path d="M0 100Q100 40 210 100T500 80v60H0" fill="#b1c59e"/><path d="M0 130Q150 70 300 130T500 110v30H0" fill="#7f9d74"/><path d="M100 130V60m0 35L80 76m20 34 24-22M282 134V40m0 40-24-24m24 44 30-28" stroke="#2f6b4f" stroke-width="5"/><ellipse cx="100" cy="46" rx="30" ry="36" fill="#2f6b4f"/><ellipse cx="282" cy="31" rx="35" ry="44" fill="#496f48"/><path d="M400 140q-80-30-15-42" stroke="#e9eedf" stroke-width="15" fill="none"/>'}</svg>`;
function upcomingCard(id,title,food=false){return `<article class="card event-card"><div class="event-image">${landscape(food)}<span class="pill">${food?'COMMUNITY CARE':'ENVIRONMENT'}</span></div><div class="event-body"><h3>${title}</h3><p>Riverside Restoration Crew · San José</p><div class="event-foot"><span class="event-date">${food?'NOV 07':'OCT 31'} · 9 AM–12 PM<br>Sample upcoming event</span><button class="btn secondary" aria-pressed="${savedEvents.has(id)}" onclick="toggleEvent('${id}')">${savedEvents.has(id)?'✓ Saved':'Save event +'}</button></div></div></article>`}
function toggleEvent(id){savedEvents.has(id)?savedEvents.delete(id):savedEvents.add(id);render();notify(savedEvents.has(id)?'Event saved for this preview. Registration stays with the organizer.':'Event removed from saved list.')}
home=function(){return `<div class="welcome"><div><span class="eyebrow">GROW A LITTLE GOOD</span><h1>Welcome back, ${esc(name().split(' ')[0])}.</h1><p class="muted">Small acts today. A story that stays with you.</p></div><a class="btn" href="#/checkin">${icon('scan').replace('<svg ','<svg width="19" height="19" ')} Check in</a></div>${state.active?activeBanner():''}<div class="dashboard-grid"><div><section class="hero"><div class="hero-text"><span class="eyebrow">ROOTED IN YOUR COMMUNITY</span><h2>Your time.<br>Something bigger.</h2><p>Show up for your community. Build a record of service you can carry anywhere.</p><a class="btn light" href="#/checkin">Check in to an event ↗</a></div><div class="hero-art">${tree}</div></section><section class="stats"><div class="stat"><small>◷</small><b>${state.empty?'0':'5'}</b><span>Attested hours</span></div><div class="stat"><small>♧</small><b>${state.empty?'0':'2'}</b><span>Completed events</span></div><div class="stat"><small>✧</small><b>2</b><span>Sample signed badges</span></div></section><div class="sectionhead"><h2>Your recent service</h2><a class="textlink" href="#/me">All records →</a></div>${state.empty?empty():card()+card(true)}${state.pending?pending():''}<div class="sectionhead" style="margin-top:30px"><h2>Keep the good going</h2><span class="eyebrow">UPCOMING · DEMO</span></div><div class="event-grid">${upcomingCard('trees','Neighborhood planting day')}${upcomingCard('food','Community pantry morning',true)}</div><p class="muted" style="font-size:11px">Event discovery preview. Signups are handled by the organization.</p></div><div class="dashboard-right"><section class="card goal-card"><div class="goal-top"><div><span class="eyebrow">YOUR PERSONAL GOAL</span><h3 style="margin-top:9px">A little closer.</h3></div><div class="goal-ring" style="background:conic-gradient(var(--green) ${state.empty?0:Math.min(360,5/goal*360)}deg,#d4dfc8 0)"><span>${state.empty?0:Math.round(5/goal*100)}%</span></div></div><p>${state.empty?0:5} of ${goal} attested hours · ${goal-(state.empty?0:5)} to go</p><button class="textlink" style="background:none;border:0;padding:4px 0;cursor:pointer" onclick="editGoal()">Edit my goal →</button></section><div class="badge-mini-card">${badgeMini()}</div><a href="#/badges/leadership" class="card next-badge" style="display:block"><span class="eyebrow">YOUR NEXT MILESTONE</span><h3>Team Leadership</h3><p style="font-size:12px">You're building something.<br>One more team-lead event to go.</p><div class="progress-track"><span style="width:66.67%"></span></div><small>2 of 3 events · 6 of 9 hours</small><p class="textlink" style="margin:17px 0 0">See requirements →</p></a><section class="card"><span class="eyebrow">A RECORD THAT TRAVELS</span><h3 style="margin-top:12px">Let your service speak.</h3><p class="muted" style="font-size:12px">Verified details. Words you can use in your next application.</p><a class="textlink" href="#/me/records/r1">Create a resume line ↗</a></section></div></div>`};
function editGoal(){document.querySelector('#share-dialog')?.remove();let d=document.createElement('div');d.id='share-dialog';d.className='overlay';d.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="share-title"><button class="close" onclick="closeShare()" aria-label="Close goal editor">×</button><span class="eyebrow">ONE HOUR AT A TIME</span><h2 id="share-title" style="margin-top:14px">Set your service goal</h2><p class="muted">A personal target to keep you moving. Only organization-attested hours count toward it.</p><form id="goalform"><label class="field">My target hours<input name="goal" type="number" min="5" max="10000" step="1" value="${goal}" required></label><button class="btn wide">Save goal</button></form><small class="muted">Saved for this preview session.</small></section>`;document.body.append(d);d.querySelector('input').focus();d.querySelector('form').onsubmit=e=>{e.preventDefault();goal=Number(new FormData(e.target).get('goal'));closeShare();render();notify('Your personal goal has been updated.')};}
const phaseBadgePage=badgePage;badgePage=function(){let h=phaseBadgePage();h=h.replace('<div class="badgegrid">',`<div class="badge-tabs" aria-label="Filter badges">${[['all','All badges'],['earned','Signed'],['progress','In progress'],['locked','Not yet earned']].map(([v,t])=>`<button class="${badgeFilter===v?'sel':''}" aria-pressed="${badgeFilter===v}" onclick="badgeFilter='${v}';render()">${t}</button>`).join('')}</div><div class="badgegrid">`);return h.replace(/class="card badgecard"/g,()=>{const i=badgePage.index++;return `class="card badgecard" ${badgeFilter!=='all'&&badges[i].status!==badgeFilter?'hidden':''}`})};const filteredBadgePage=badgePage;badgePage=function(){badgePage.index=0;return filteredBadgePage()};
const phaseMe=me;me=function(){return phaseMe().replace('<h2>Attested records', '<label for="record-search" class="eyebrow">Find a record</label><input id="record-search" class="filter-search" type="search" placeholder="Search events, organizations, or roles" oninput="filterRecords(this.value)"><p id="search-empty" class="muted" hidden>No records match your search.</p><h2>Attested records')};
function filterRecords(q){let n=0;document.querySelectorAll('a.card.record').forEach(e=>{let match=e.textContent.toLowerCase().includes(q.toLowerCase());e.style.display=match?'flex':'none';if(match)n++});document.querySelector('#search-empty').hidden=n>0;}
const phaseLayout=layout;layout=function(body){return phaseLayout(body).replace('STRUCTURE PREVIEW · Sample records and interactions. No real hours are recorded.','PHASE 1 PREVIEW · Sample service records · Explore the desktop and phone layouts').replace('<div class="topright">','<div class="topright"><div class="preview-tools"><a href="#/join">Your profile ↗</a></div>')};
